[package]
name = "scribe"
version = "0.1.0"
description = "A clean, minimal desktop document editor"
authors = ["Leo Bähre"]
license = "MIT"
repository = "https://github.com/leobaehre/scribe"
edition = "2024"

[lib]
name = "scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
